openapi: 3.0.3
info:
  title: <Project Name> API
  version: 1.5.0
  description: |
    REST API for the <Project Name> integrated system.
    All endpoints except /health, /health/ready, and /auth/login require a Bearer JWT token.
servers:
  - url: https://<your-domain>/api/v1
    description: Production
  - url: http://localhost:3000/api/v1
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Orders

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness check (is the API process running?)
      security: []
      servers:
        - url: https://<your-domain>
      responses:
        '200':
          description: API is running
          content:
            application/json:
              example: { "status": "ok", "version": "v1.5.0" }

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness check (is the API connected to the DB and queue?)
      security: []
      servers:
        - url: https://<your-domain>
      responses:
        '200':
          description: Ready for traffic
          content:
            application/json:
              example: { "status": "ok", "db": "up", "queue": "up" }
        '503':
          description: Not ready — a dependency is down
          content:
            application/json:
              example: { "status": "error", "db": "up", "queue": "down" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and get a JWT token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example: { "email": "user@example.com", "password": "secret123" }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders:
    get:
      tags: [Orders]
      summary: List orders
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
                  page: { type: integer }
                  total: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Orders]
      summary: Create an order (also publishes an "order.created" job to the queue)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example: { "item": "Wireless Mouse", "quantity": 2 }
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: 101
                item: Wireless Mouse
                quantity: 2
                status: pending
                createdAt: '2026-11-20T10:15:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get one order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }

    LoginResponse:
      type: object
      properties:
        token: { type: string, example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... }
        expiresIn: { type: integer, example: 3600 }

    CreateOrderRequest:
      type: object
      required: [item, quantity]
      properties:
        item: { type: string, minLength: 1, maxLength: 100 }
        quantity: { type: integer, minimum: 1, maximum: 999 }

    Order:
      type: object
      properties:
        id: { type: integer }
        item: { type: string }
        quantity: { type: integer }
        status:
          type: string
          enum: [pending, processed, failed]
        createdAt: { type: string, format: date-time }

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items: { type: string }

  responses:
    ValidationError:
      description: Request body is invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: VALIDATION_ERROR
              message: Request body is invalid
              details: ['quantity must be at least 1']
    Unauthorized:
      description: Missing, invalid, or expired token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: UNAUTHORIZED, message: Missing or invalid token }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: NOT_FOUND, message: Order 999 not found }
    ServiceUnavailable:
      description: Database or message queue is unreachable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: SERVICE_UNAVAILABLE, message: Message queue is unreachable, try again later }
